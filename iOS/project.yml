name: BetterBob-iOS
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Free signing: leave DEVELOPMENT_TEAM blank — Xcode fills in the
    # Personal Team you pick in Signing & Capabilities on first open.
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "2.18"
packages:
  BetterBobShared:
    path: ../Packages/BetterBobShared
# Only the app is a runnable scheme — running the widget-extension target
# directly can't work (extensions are launched by the system, not the
# debugger), so no scheme is generated for it.
schemes:
  BetterBob:
    build:
      targets:
        BetterBob: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  BetterBob:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Common
      - path: Sources/Screens
      - path: Sources/Shared
      # App Intents must compile into the app target itself so Shortcuts
      # metadata extraction sees them; the file is shared with the Mac build.
      - path: ../Sources/Intents/BobIntents.swift
      - path: Resources/Assets.xcassets
      # Required-reason API declaration (UserDefaults / CA92.1); App Store
      # uploads scan every bundle for it.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        # k3n.betterbob, not .ios: the .ios ids got burned into the free
        # Personal Team by on-device dev builds, and App IDs are globally
        # unique — the paid team can never register them. The Mac app's
        # k3n.betterbob is only ever self-signed, so it is free to claim.
        PRODUCT_BUNDLE_IDENTIFIER: k3n.betterbob
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/BetterBob.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: BetterBobShared
      - target: BetterBobWidgets
        embed: true
      - target: BetterBobWatch
        embed: true
        codeSign: true
  # The wrist companion. No session of its own — it renders the WidgetSnapshot
  # the phone pushes over WCSession and sends punch commands back; the phone
  # performs them through the same headless path the Live Activity uses.
  BetterBobWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Watch
      # Foundation-only by design (see its header), so the watch compiles it
      # directly — same type, same JSON, no shared framework needed.
      - path: ../Packages/BetterBobShared/Sources/BetterBobShared/Models/WidgetSnapshot.swift
      - path: Resources/WatchAssets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: k3n.betterbob.watchkitapp
        INFOPLIST_FILE: Resources/Watch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Watch.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Nothing here needs anything newer than WCSession + basic SwiftUI;
        # a floor of 26 would just hide the app from not-yet-updated watches.
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        SKIP_INSTALL: true
    dependencies:
      # Embedded, which is the only way a complication is offered on a watch
      # face at all.
      - target: BetterBobWatchWidgets
        embed: true

  # The watch-face complications. They read the WidgetSnapshot the watch app
  # mirrors into the WATCH'S OWN app group (a watch shares none with the
  # phone) — same type and JSON the phone pushes over WCSession.
  BetterBobWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/WatchWidgets
      - path: Sources/Watch/WatchBobFace.swift
      - path: Sources/Watch/WatchStore.swift
      - path: ../Packages/BetterBobShared/Sources/BetterBobShared/Models/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: k3n.betterbob.watchkitapp.widgets
        INFOPLIST_FILE: Resources/WatchWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/WatchWidgets.entitlements
        GENERATE_INFOPLIST_FILE: false
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        SKIP_INSTALL: true

  BetterBobWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: k3n.betterbob.widgets
        INFOPLIST_FILE: Resources/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Widgets.entitlements
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
    dependencies:
      - package: BetterBobShared
